<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DADS - Stutter Detection</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- wavesurfer.js -->
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/spectrogram.js"></script>
</head>
<body>
    <div class="header">
        <h1>DADS - Stutter Detection</h1>
        <span style="color: #666; font-size: 13px;">Detection and Analysis of Dysfluencies in Speech</span>
    </div>

    <div class="main-layout">
        <!-- Passages Sidebar -->
        <div class="panel passages-panel">
            <div class="panel-title">Passages</div>
            <div id="passage-list"></div>
            <label class="btn btn-sm btn-block" style="margin-top: 12px;">
                + Upload Passage
                <input type="file" id="passage-upload" class="hidden" accept=".pdf">
            </label>
        </div>

        <!-- Center: PDF + Audio -->
        <div style="grid-column: 2; display: flex; flex-direction: column; overflow: hidden;">
            <!-- PDF Viewer -->
            <div class="panel pdf-panel" style="flex: 1; min-height: 0;">
                <div class="pdf-content" id="pdf-container">
                    <span style="color: #666;">Select a passage or start a new session</span>
                </div>
                <div class="pdf-nav" id="pdf-nav" style="display: none;">
                    <button class="btn btn-sm" id="pdf-prev">Prev</button>
                    <span id="pdf-page-info">Page 1 / 1</span>
                    <button class="btn btn-sm" id="pdf-next">Next</button>
                </div>
            </div>

            <!-- Audio Section -->
            <div class="panel audio-section">
                <div id="waveform"></div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="audio-controls">
                    <button class="btn btn-sm" id="seek-back">&lt;&lt; 5s</button>
                    <button class="btn" id="play-pause">Play</button>
                    <button class="btn btn-sm" id="seek-forward">5s &gt;&gt;</button>
                    <span class="time-display" id="time-display">0:00 / 0:00</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="audio-actions">
                        <label class="btn btn-sm">
                            Upload Audio
                            <input type="file" id="audio-upload" class="hidden" accept="audio/*,.wav,.mp3,.ogg,.flac">
                        </label>
                        <button class="btn btn-sm" id="record-btn">Record</button>
                        <div class="recording-indicator" id="recording-indicator">
                            <div class="rec-dot"></div>
                            <span>Recording...</span>
                        </div>
                    </div>
                    <div class="graph-toggles">
                        <button class="btn btn-sm" id="toggle-spectrogram">Spectrogram</button>
                        <button class="btn btn-sm" id="toggle-waveform">Waveform</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stutter Panel -->
        <div class="panel stutter-panel">
            <div class="panel-title">Stutter Classes</div>
            <div class="detection-status" id="detection-status" style="display: none;"></div>
            <div class="stutter-class" id="class-prolongation">
                <div class="label">Prolongation</div>
                <div class="value">-</div>
                <div class="count">[0]</div>
            </div>
            <div class="stutter-class" id="class-block">
                <div class="label">Block</div>
                <div class="value">-</div>
                <div class="count">[0]</div>
            </div>
            <div class="stutter-class" id="class-soundrep">
                <div class="label">Sound Repetition</div>
                <div class="value">-</div>
                <div class="count">[0]</div>
            </div>
            <div class="stutter-class" id="class-wordrep">
                <div class="label">Word Repetition</div>
                <div class="value">-</div>
                <div class="count">[0]</div>
            </div>
            <div class="stutter-class" id="class-interjection">
                <div class="label">Interjection</div>
                <div class="value">-</div>
                <div class="count">[0]</div>
            </div>
            <div style="flex: 1;"></div>
            <button class="btn btn-block" id="export-btn" disabled>Export Report</button>
        </div>
    </div>

    <script src="/static/js/pdf-viewer.js"></script>
    <script src="/static/js/player.js"></script>
    <script src="/static/js/recorder.js"></script>
    <script src="/static/js/analysis.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
